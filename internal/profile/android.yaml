# Android Profile: packages Sthin disables with pm disable-user --user 0.
# Package names seeded from avdslim (kdbhalala, MIT); see NOTICE.
# com.google.android.bluetooth: system_server crash-loops on Android 16+ when disabled.
platform: android
version: 1
validated_against:
  api: "36"
  image: google_apis
never_disable:
  - com.google.android.bluetooth
categories:
  - id: assistant
    name: "Assistant & Search"
    default: true
    items:
      - com.google.android.googlequicksearchbox
      - com.google.android.as
      - com.google.android.as.oss
  - id: bluetooth
    name: "Bluetooth & Peripheral Services"
    default: true
    items:
      - com.android.bluetoothmidiservice
  - id: privacy
    name: "Privacy Sandbox & Ad Measurement"
    default: true
    items:
      - com.google.android.adservices.api
      - com.google.mainline.adservices
  - id: wellbeing
    name: "Wellbeing, Intelligence & AI"
    default: true
    items:
      - com.google.android.apps.wellbeing
      - com.google.android.settings.intelligence
      - com.android.emulator.multidisplay
      - com.google.android.apps.bard
      - com.google.android.apps.restore
      - com.google.android.apps.pulse
      - com.google.android.configupdater
      - com.google.android.projection.gearhead
      - com.google.android.healthconnect.controller
      - com.android.imsserviceentitlement
      - com.android.carrierdefaultapp
      - com.google.android.ondevicepersonalization.services
      - com.google.android.federatedcompute
      - com.google.android.glasses.companion
      - com.google.android.glasses.core
      - com.google.android.apps.safetyhub
      - com.google.android.markup
  - id: media
    name: "Media & Consumer Apps"
    default: true
    items:
      - com.google.android.apps.photos
      - com.google.android.youtube
      - com.google.android.videos
      - com.google.android.music
      - com.google.android.apps.youtube.music
      - com.google.android.apps.maps
      - com.google.android.gm
      - com.google.android.apps.docs
      - com.android.gallery3d
      - com.android.music
      - com.android.camera2
      - com.android.cameraextensions
      - com.android.DeviceAsWebcam
  - id: telephony
    name: "Telephony, Emergency & Satellite"
    default: true
    items:
      - com.google.android.apps.messaging
      - com.google.android.dialer
      - com.google.android.contacts
      - com.android.mms
      - com.android.dialer
      - com.android.contacts
      - com.google.android.cellbroadcastservice
      - com.android.cellbroadcastreceiver
      - com.google.android.telephony.satellite
      - com.android.stk
  - id: accessibility
    name: "Accessibility & Speech"
    default: true
    items:
      - com.google.android.tts
      - com.google.android.marvin.talkback
      - com.google.android.apps.accessibility.voiceaccess
  - id: printing
    name: "Printing & Background Spoolers"
    default: true
    items:
      - com.android.printspooler
      - com.android.bips
      - com.google.android.printservice.recommendation
  - id: telemetry
    name: "Telemetry, Feedback & Screensavers"
    default: true
    items:
      - com.google.android.feedback
      - com.android.traceur
      - com.android.dreams.basic
      - com.android.dreams.phototable
      - com.android.wallpaper.livepicker
      - com.google.android.apps.wallpaper
      - com.android.emergency
      - com.android.calendar
      - com.google.android.calendar
      - com.android.deskclock
      - com.google.android.deskclock
      - com.android.calculator2
      - com.google.android.calculator
aggressive:
  - com.android.vending
  - com.android.chrome
  - com.google.android.partnersetup
  - com.google.android.setupwizard
  - com.android.setupwizard
