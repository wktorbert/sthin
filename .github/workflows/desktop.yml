# Checks every push and pull request on macOS and Windows; on a v* tag, builds,
# signs (macOS), notarizes (macOS) and uploads the desktop app to a draft
# GitHub Release. The CLI binaries ship from the same tag.
#
# macOS signing secrets (https://v2.tauri.app/distribute/sign/macos/):
#   APPLE_CERTIFICATE (base64 .p12 of the Developer ID Application cert),
#   APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, KEYCHAIN_PASSWORD,
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_BASE64 (App Store Connect key).
# Windows builds are unsigned and published as a preview.
name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64-preview
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Stamp the tag's version into the app and the sidecar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 - "$v" <<'PY'
          import json, sys
          p = "desktop/src-tauri/tauri.conf.json"
          c = json.load(open(p)); c["version"] = sys.argv[1]
          json.dump(c, open(p, "w"), indent=2)
          PY

      - name: Build the sidecar
        run: scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Go checks (Serve protocol included)
        if: matrix.os == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
        run: go vet ./... && go test ./... -count=1

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop checks
        working-directory: desktop
        run: |
          pnpm -s typecheck
          pnpm -s test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'

      # Signing and notarization are opt-in: only secrets that are set reach
      # the bundler. An empty APPLE_CERTIFICATE would still make it try (and
      # fail) to import a certificate, so unset ones are not exported at all.
      - name: Expose Apple signing secrets when present
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY; do
            v="${!k}"
            [ -n "$v" ] || continue
            { echo "$k<<SECRET_EOF"; echo "$v"; echo "SECRET_EOF"; } >> "$GITHUB_ENV"
          done
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
          [ -n "$APPLE_CERTIFICATE" ] && echo "signing: on" || echo "signing: off (no APPLE_CERTIFICATE secret; the app ships unsigned)"

      - name: Build, sign and release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Sthin ${{ github.ref_name }}
          releaseDraft: true
          assetNamePattern: "[name]_[version]_${{ matrix.suffix }}[ext]"

  # The same tag ships the command-line binaries next to the desktop bundles:
  # one archive per platform, a sha256 checksum file, and the Homebrew formula
  # (pushed to wktorbert/homebrew-tap when HOMEBREW_TAP_TOKEN is set; the
  # formula's download URLs work once the draft release is published).
  cli:
    # Runs after the desktop builds whether or not they succeeded: a signing
    # or bundling problem on one platform must not hold back the CLI release.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Job-level so the formula step's `if` can see it: a step cannot read its
    # own env block in its condition, and `secrets` is not allowed there.
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives and checksums
        run: scripts/release-cli.sh "${GITHUB_REF_NAME#v}" dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The desktop job normally creates the draft release; create it here
          # when that job did not get that far.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Sthin $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/sthin_* dist/sthin-*.bottle.tar.gz dist/checksums.txt --clobber
      - name: Publish the Homebrew formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/wktorbert/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$v" dist/checksums.txt > tap/Formula/sthin.rb
          cd tap
          git config user.name "sthin release bot"
          git config user.email "release@sthin.invalid"
          git add Formula/sthin.rb
          git commit -m "sthin $v" || echo "formula unchanged"
          # HEAD:main also works on a brand-new, empty tap with no branch yet.
          git push origin HEAD:main
